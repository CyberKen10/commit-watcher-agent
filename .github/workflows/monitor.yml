name: Monitor public repo and send commit summary

on:
  schedule:
    - cron: '*/15 * * * *' # cada 15 minutos (ajusta si quieres)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Debug secret/env availability
        env:
          GH_TOKEN_CUSTOM: ${{ secrets.GH_TOKEN_CUSTOM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO_LIST: ${{ secrets.EMAIL_TO_LIST }}
        run: |
          echo "GH_TOKEN_CUSTOM set? $([ -n "$GH_TOKEN_CUSTOM" ] && echo yes || echo no)"
          echo "OPENAI_API_KEY set? $([ -n "$OPENAI_API_KEY" ] && echo yes || echo no)"
          echo "EMAIL_USERNAME set? $([ -n "$EMAIL_USERNAME" ] && echo yes || echo no)"
          echo "EMAIL_PASSWORD set? $([ -n "$EMAIL_PASSWORD" ] && echo yes || echo no)"
          echo "EMAIL_TO_LIST set? $([ -n "$EMAIL_TO_LIST" ] && echo yes || echo no)"

      - name: Run monitor script
        env:
          TARGET_OWNER: 'CyberKen10' # ← editar
          TARGET_REPO: 'commit-watcher-agent' # ← editar
          GH_TOKEN_CUSTOM: ${{ secrets.GH_TOKEN_CUSTOM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO_LIST: ${{ secrets.EMAIL_TO_LIST }}
        run: |
          python3 scripts/check_and_notify.py

      - name: Detect last_sha changes
        id: sha_changes
        run: |
          if git diff --quiet -- last_sha.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in last_sha.txt"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected changes in last_sha.txt"
          fi

      - name: Create Pull Request with updated SHA
        id: cpr
        if: steps.sha_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN_CUSTOM || secrets.GITHUB_TOKEN }}
          commit-message: "chore: actualizar last_sha automáticamente"
          title: "chore: actualizar last_sha automáticamente"
          body: |
            Este PR fue generado automáticamente por el workflow de monitoreo.

            - Actualiza `last_sha.txt` con el último commit detectado.
            - Evita reprocesar commits ya notificados.
          branch: "bot/update-last-sha"
          delete-branch: true
          add-paths: |
            last_sha.txt

      - name: Auto-approve generated PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_CUSTOM || secrets.GITHUB_TOKEN }}
        run: gh pr review "${{ steps.cpr.outputs.pull-request-number }}" --approve

      - name: Enable auto-merge on generated PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_CUSTOM || secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash
