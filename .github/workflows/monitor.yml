name: Monitor public repo and send commit summary

on:
  schedule:
    - cron: '*/15 * * * *' # cada 15 minutos (ajusta si quieres)
  workflow_dispatch:

jobs:
  check-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run monitor script
        env:
          TARGET_OWNER: 'CyberKen10' # ← editar
          TARGET_REPO: 'commit-watcher-agent' # ← editar
          GITHUB_TOKEN_CUSTOM: ${{ secrets.G_TOKEN_CUSTOM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO_LIST: 'kendryjavierdelpino@gmail.com' # o poner en secret
        run: |
          python3 scripts/check_and_notify.py
